name: ALIEN research audit (stdlib)
on:
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/alien-research-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run read-only audit unit tests
        run: python -m unittest discover -s research -p "test_*.py" -v
