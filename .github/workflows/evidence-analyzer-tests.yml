name: ALIEN Automatic Evidence Analyzer Tests
on:
  pull_request:
    paths:
      - 'tools/analyze_mt5_evidence.py'
      - 'tests/test_analyze_mt5_evidence.py'
      - '.github/workflows/evidence-analyzer-tests.yml'
  push:
    branches:
      - 'audit/smc-liquidity-evidence-20261113'
    paths:
      - 'tools/analyze_mt5_evidence.py'
      - 'tests/test_analyze_mt5_evidence.py'
      - '.github/workflows/evidence-analyzer-tests.yml'
permissions:
  contents: read
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sintaxe
        run: python -m py_compile tools/analyze_mt5_evidence.py
      - name: Arquivo adulterado, comparacoes e privacidade
        run: python -m unittest discover -s tests -p test_analyze_mt5_evidence.py -v
