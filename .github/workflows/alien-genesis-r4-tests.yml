name: ALIEN GENESIS R4 Static Checks
on:
  push:
    branches: ["feat/alien-genesis-mtf-r4-20261113"]
    paths:
      - "MQL5/Experts/ALIEN_GENESIS_MTF_R4_DEMO.mq5"
      - "tests/test_alien_genesis_r4.py"
      - ".github/workflows/alien-genesis-r4-tests.yml"
  pull_request:
    paths:
      - "MQL5/Experts/ALIEN_GENESIS_MTF_R4_DEMO.mq5"
      - "tests/test_alien_genesis_r4.py"
      - ".github/workflows/alien-genesis-r4-tests.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_alien_genesis_r4.py' -v
