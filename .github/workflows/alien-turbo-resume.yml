name: ALIEN TURBO Resume H-I Safety
on:
  push:
    branches: ["feat/alien-goat5k-turbo-discovery-20261113"]
    paths:
      - "tools/RETOMAR_ALIEN_TURBO_H_I.ps1"
      - "tools/audit_alien_turbo.py"
      - "tests/test_alien_turbo_resume.py"
      - ".github/workflows/alien-turbo-resume.yml"
  pull_request:
    paths:
      - "tools/RETOMAR_ALIEN_TURBO_H_I.ps1"
      - "tools/audit_alien_turbo.py"
      - "tests/test_alien_turbo_resume.py"
      - ".github/workflows/alien-turbo-resume.yml"
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python static syntax
        run: python -m py_compile tests/test_alien_turbo_resume.py tools/audit_alien_turbo.py
      - name: Resume script guard invariants
        run: python -m unittest discover -s tests -p 'test_alien_turbo_resume.py' -v
      - name: PowerShell parser syntax on Windows-compatible script
        shell: pwsh
        run: |
          $tok=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/RETOMAR_ALIEN_TURBO_H_I.ps1").Path,
            [ref]$tok,[ref]$errors
          )|Out-Null
          if($errors.Count -gt 0){throw "$errors"}
