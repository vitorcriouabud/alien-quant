name: ALIEN GOAT5K Shadow Static Audit
on:
  push:
    branches: ["feat/alien-goat5k-safety-lab-20261113"]
    paths:
      - "MQL5/Experts/ALIEN_GOAT5K_RISK_SHADOW.mq5"
      - "MQL5/Experts/GOAT_XAUUSD_SPREAD_READONLY.mq5"
      - "MQL5/Profiles/Tester/ALIEN_GOAT5K_RISK_SHADOW.set"
      - "tools/RODAR_GOAT5K_RISK_LAB.ps1"
      - "tests/test_alien_goat5k_static.py"
      - ".github/workflows/alien-goat5k-static.yml"
  pull_request:
    paths:
      - "MQL5/Experts/ALIEN_GOAT5K_RISK_SHADOW.mq5"
      - "MQL5/Experts/GOAT_XAUUSD_SPREAD_READONLY.mq5"
      - "MQL5/Profiles/Tester/ALIEN_GOAT5K_RISK_SHADOW.set"
      - "tools/RODAR_GOAT5K_RISK_LAB.ps1"
      - "tests/test_alien_goat5k_static.py"
      - ".github/workflows/alien-goat5k-static.yml"
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_alien_goat5k_static.py' -v
      - name: PowerShell syntax only (not execution)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
             (Resolve-Path "tools/RODAR_GOAT5K_RISK_LAB.ps1").Path,
             [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { throw "$errors" }
